<!doctype html>
<html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0f1115"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Trainingslog"><link rel="manifest" href="manifest.webmanifest"><title>Trainingslog 6 weken</title><style>:root{--bg:#0f1115;--card:#171a21;--card2:#1d222b;--text:#f4f6f8;--muted:#a9b0bb;--line:#303743;--accent:#5aa7ff;--danger:#ff6b6b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}.wrap{max-width:980px;margin:auto;padding:16px;padding-top:max(16px,env(safe-area-inset-top));padding-bottom:max(16px,env(safe-area-inset-bottom))}h1{margin:0 0 4px;font-size:24px}.muted{color:var(--muted);font-size:14px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}button,.filebtn{border:1px solid var(--line);background:var(--card2);color:var(--text);border-radius:10px;padding:10px 14px;min-height:44px;font-weight:700;cursor:pointer}button.active{background:var(--accent);border-color:var(--accent);color:#fff}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 0}.exhead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}.name{font-weight:800;font-size:17px}.target,.previous{font-size:12px;color:var(--muted);margin-top:3px}.previous{color:#b9d8ff;margin-top:6px}.sets{margin-top:12px;display:grid;gap:8px}.setrow{display:grid;grid-template-columns:56px minmax(0,1fr) minmax(0,1fr) 46px;gap:8px;align-items:end}.setlabel{padding-bottom:12px;color:var(--muted);font-size:13px}label{font-size:12px;color:var(--muted)}input,textarea{width:100%;background:#11151b;border:1px solid var(--line);color:var(--text);border-radius:9px;padding:10px;font-size:16px;min-height:44px;margin-top:4px}textarea{min-height:80px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.danger{border-color:var(--danger);color:#ffd6d6}.status{color:var(--muted);font-size:13px}@media(max-width:650px){.grid3{grid-template-columns:1fr}.setrow{grid-template-columns:44px minmax(0,1fr) minmax(0,1fr) 42px}.wrap{padding-left:12px;padding-right:12px}}</style></head><body><div class="wrap"><h1>6 weken trainingslog</h1><div class="muted">Je invoer wordt automatisch op dit apparaat opgeslagen.</div><div id="weeks" class="tabs"></div><div id="sessions" class="tabs"></div><div class="card"><div id="title" class="name"></div><div id="subtitle" class="muted"></div><div id="progress" class="status" style="margin-top:6px"></div></div><div id="exerciseList"></div><div class="card"><div class="name" style="margin-bottom:10px">Na de training</div><div class="grid3"><label>Energie 1–10<input id="energy" type="number" min="1" max="10"></label><label>Schouderpijn 0–10<input id="shoulder" type="number" min="0" max="10"></label><label>Zwaarte 1–10<input id="effort" type="number" min="1" max="10"></label></div><label style="display:block;margin-top:10px">Notitie<textarea id="notes"></textarea></label></div><div class="actions"><button id="exportBtn">Export backup</button><label class="filebtn" for="importFile">Import backup</label><input id="importFile" type="file" accept=".json,application/json" style="display:none"><button id="clearSession">Wis huidige sessie</button><button id="clearAll" class="danger">Wis alles</button></div><div id="saveStatus" class="status">Opgeslagen</div></div><script>(function(){const STORE='gym_log_v2',OLD='training_log_6_weken_v1';const workouts={A:{name:'Bovenlichaam',sub:'Schoudervriendelijk',ex:[['Pull-ups / assisted pull-ups','3 × 5–10'],['DB bench press · neutrale greep','3 × 8–12'],['Cable row','3 × 8–12'],['Push-ups','3 × bijna max'],['Face pulls','3 × 15–20'],['Triceps pushdown','3 × 10–15'],['Dumbbell curls','3 × 10–15'],['Dead hang','2 × 20–40 sec']]},B:{name:'Benen + core',sub:'Benen · billen · buik',ex:[['Leg press','3 × 8–12'],['Romanian deadlift','3 × 8–10'],['Bulgarian split squat','3 × 8–12 / been'],['Goblet squat','3 × 10–15'],['Standing calf raises','3 × 12–20'],['Hanging knee raises','3 × 8–15'],['Plank','3 × 30–60 sec']]},C:{name:'Full body',sub:'Kracht + calisthenics',ex:[['Chin-ups','3 × 5–10'],['Squat','3 × 6–10'],['Incline dumbbell press','3 × 8–12'],['One-arm cable / dumbbell row','3 × 8–12'],['Walking lunges','3 × 10 / been'],['Push-ups / pijnvrije dips','3 × 8–15'],['Face pulls','3 × 15–20'],['Hanging knee raises','3 × 10–15']]}};let week=1,session='A',data={};try{const raw=localStorage.getItem(STORE)||localStorage.getItem(OLD)||'{}';data=JSON.parse(raw);if(!localStorage.getItem(STORE)&&localStorage.getItem(OLD))localStorage.setItem(STORE,raw)}catch(e){data={}}function k(w=week,s=session){return w+'-'+s}function d(){return{kg:'',reps:''}}function ensure(){if(!data[k()])data[k()]={rows:{},energy:'',shoulder:'',effort:'',notes:''};const c=data[k()];workouts[session].ex.forEach((_,i)=>{if(!c.rows)c.rows={};if(!c.rows[i])c.rows[i]={sets:[d(),d(),d()]};if(!Array.isArray(c.rows[i].sets)||!c.rows[i].sets.length)c.rows[i].sets=[d(),d(),d()]});return c}function save(){localStorage.setItem(STORE,JSON.stringify(data));document.getElementById('saveStatus').textContent='Automatisch opgeslagen'}function saveMeta(){const c=ensure();['energy','shoulder','effort','notes'].forEach(x=>c[x]=document.getElementById(x).value);save()}function prev(i){if(week===1)return'';const p=data[k(week-1,session)];if(!p||!p.rows||!p.rows[i])return'';const f=(p.rows[i].sets||[]).filter(s=>s.kg||s.reps);return f.length?'Vorige week: '+f.map(s=>(s.kg||'–')+' kg × '+(s.reps||'–')).join(' · '):''}function nav(){const w=document.getElementById('weeks');w.innerHTML='';for(let x=1;x<=6;x++){const b=document.createElement('button');b.textContent='Week '+x;if(x===week)b.className='active';b.onclick=()=>{saveMeta();week=x;render()};w.appendChild(b)}const s=document.getElementById('sessions');s.innerHTML='';['A','B','C'].forEach(x=>{const b=document.createElement('button');b.textContent=x+' · '+workouts[x].name;if(x===session)b.className='active';b.onclick=()=>{saveMeta();session=x;render()};s.appendChild(b)})}function render(){nav();const c=ensure();document.getElementById('title').textContent='Week '+week+' · Training '+session;document.getElementById('subtitle').textContent=workouts[session].name+' · '+workouts[session].sub;const list=document.getElementById('exerciseList');list.innerHTML='';workouts[session].ex.forEach((ex,i)=>{const row=c.rows[i],card=document.createElement('div');card.className='card';const head=document.createElement('div');head.className='exhead';const info=document.createElement('div'),p=prev(i);info.innerHTML='<div class="name">'+ex[0]+'</div><div class="target">Doel: '+ex[1]+'</div>'+(p?'<div class="previous">'+p+'</div>':'');const add=document.createElement('button');add.textContent='+ Set';add.onclick=()=>{const last=row.sets[row.sets.length-1]||d();row.sets.push({kg:last.kg||'',reps:''});save();render()};head.append(info,add);card.appendChild(head);const sets=document.createElement('div');sets.className='sets';row.sets.forEach((set,j)=>{const r=document.createElement('div');r.className='setrow';const n=document.createElement('div');n.className='setlabel';n.textContent='Set '+(j+1);const kl=document.createElement('label');kl.textContent='Gewicht (kg)';const kg=document.createElement('input');kg.type='number';kg.step='.5';kg.min='0';kg.value=set.kg||'';kg.oninput=()=>{set.kg=kg.value;save();progress()};kl.appendChild(kg);const rl=document.createElement('label');rl.textContent='Reps / sec';const reps=document.createElement('input');reps.type='number';reps.min='0';reps.value=set.reps||'';reps.oninput=()=>{set.reps=reps.value;save();progress()};rl.appendChild(reps);const del=document.createElement('button');del.textContent='−';del.onclick=()=>{if(row.sets.length>1){row.sets.splice(j,1);save();render()}};r.append(n,kl,rl,del);sets.appendChild(r)});card.appendChild(sets);list.appendChild(card)});['energy','shoulder','effort','notes'].forEach(x=>document.getElementById(x).value=c[x]||'');progress();save()}function progress(){const c=ensure();let done=0;workouts[session].ex.forEach((_,i)=>{if(c.rows[i].sets.some(s=>s.kg||s.reps))done++});document.getElementById('progress').textContent=done+' / '+workouts[session].ex.length+' oefeningen ingevuld'}['energy','shoulder','effort','notes'].forEach(id=>document.getElementById(id).oninput=saveMeta);document.getElementById('exportBtn').onclick=()=>{saveMeta();const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='training-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)};document.getElementById('importFile').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(!x||typeof x!=='object')throw 0;data=x;save();render();alert('Backup hersteld.')}catch(_){alert('Ongeldige backup.')}};r.readAsText(f);e.target.value=''};document.getElementById('clearSession').onclick=()=>{if(confirm('Deze sessie wissen?')){delete data[k()];save();render()}};document.getElementById('clearAll').onclick=()=>{if(confirm('Alle trainingsdata wissen?')){data={};save();render()}};window.addEventListener('beforeunload',saveMeta);render();if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));})();</script></body></html>
